<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICM AI Assistant - Portal</title>
    
    <script src="marked.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="chat-container">
        
        <div class="header">
            <img src="image/sicm-logo.png" alt="SICM Logo" class="logo">
            <div class="header-text">
                <span class="title">Santa Isabel College of Manila AI Chatbot</span>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">Welcome, Isabelan! How can I help you today?</div>
            <div id="typing" style="display: none;">Assistant is thinking</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about School Admission, Strands, or History..." autofocus>
            <button id="sendBtn">Send Message</button>
        </div>
        
    </div>

    <script src="script.js"></script>

</body>
</html>
